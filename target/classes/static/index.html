
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Academia Demo | Laboratorio de autenticación</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="lab-banner">
        LABORATORIO ACADÉMICO · DATOS FICTICIOS · NO ES UN PORTAL REAL
    </div>

    <header class="topbar">
        <div class="brand">
            <span class="welcome">WELCOME!</span>
            <span class="brand-name">ACADEMIA<span class="brand-star">✦</span></span>
        </div>
    </header>

    <main class="container">
        <h1>Iniciar sesión</h1>

        <p class="intro">
            Ingresa con tu documento de identidad y contraseña de Academia Demo.
        </p>

        <p class="notice">
            Entorno de pruebas con datos ficticios. No introduzcas credenciales reales.
        </p>

        <form id="login-form" autocomplete="off">
            <label for="documento">Código o Documento de identidad</label>
            <input
                id="documento"
                name="documento"
                type="text"
                maxlength="1000"
                autocomplete="off"
                required
            >

            <label for="password">Contraseña</label>

            <div class="password-wrap">
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required
                >

                <button
                    class="eye"
                    id="toggle-password"
                    type="button"
                >◉</button>
            </div>

            <div class="forgot">
                <a href="#" id="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="login-button" type="submit">
                INICIAR SESIÓN
            </button>
        </form>

        <p id="message" class="message" role="status" aria-live="polite"></p>
    </main>

    <script>
        const form = document.querySelector("#login-form");
        const message = document.querySelector("#message");

        // Mostrar u ocultar contraseña
        document.querySelector("#toggle-password")
            .addEventListener("click", () => {
                const field = document.querySelector("#password");

                field.type =
                    field.type === "password" ? "text" : "password";
            });

        // DEMOSTRACIÓN DOM-XSS:
        // La entrada se interpreta como HTML en el navegador.
        // No se envía ni se almacena información.
        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const documento =
                document.querySelector("#documento").value;

            const password =
                document.querySelector("#password").value;

            // Selecciona el campo que contiene la entrada de prueba.
            const entrada = [documento, password]
                .find(valor => /[<>]/.test(valor));

            if (!entrada) {
                message.textContent =
                    "Simulación: no se detectó una entrada de prueba.";

                return;
            }

            // PUNTO VULNERABLE INTENCIONAL DEL LABORATORIO.
            message.innerHTML = entrada;
        });

        // Recuperación deshabilitada
        document.querySelector("#forgot-link")
            .addEventListener("click", (event) => {
                event.preventDefault();

                message.textContent =
                    "Recuperación deshabilitada en esta maqueta.";
            });
    </script>
</body>
</html>
